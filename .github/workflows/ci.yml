name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Trigger workflow manually with optional redeploy_only input
  workflow_dispatch:
    inputs:
      redeploy_only:
        description: "Redeploy Only"
        type: boolean
        default: false

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/orderservice:${{ github.sha }}

jobs:
  format-build-and-test:
    if: ${{!inputs.redeploy_only}}
    name: Format, Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4 # https://github.com/marketplace/actions/cache
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore
      - name: Format Code
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build

      - name: Check Vulnerable Packages
        run: dotnet list package  --vulnerable --include-transitive

  docker-build-and-scan:
    if: ${{!inputs.redeploy_only}}
    name: Docker Build and Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: format-build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4 # https://github.com/marketplace/actions/docker-setup-buildx

      - name: Build Image
        uses: docker/build-push-action@v7 # https://github.com/marketplace/actions/build-and-push-docker-images
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.DOCKER_IMAGE }}

      - name: Scan Image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0 # https://github.com/marketplace/actions/aqua-security-trivy
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4 # https://github.com/marketplace/actions/docker-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }} #references user who triggered the workflow
          password: ${{ secrets.GITHUB_TOKEN }} #uses the GitHub token for authentication

      - name: Push Image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker push ${{ env.DOCKER_IMAGE }}

  deploy:
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' }}
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker-build-and-scan

    steps:
      - name: Pull Image
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}
      - name: Stop and Remove Existing Container
        run: docker rm -f orderservice 2>/dev/null || true
      - name: Run Container
        run: |
          docker run -d --name orderservice -p 8080:8080 \
            -e APP_VERSION=${{github.sha}} \
            ${{ env.DOCKER_IMAGE }}
      - name: Verify Container Version is Correct
        run: |
          ACTUAL_VERSION=$(curl --retry 5 --retry-connrefused --fail http://localhost:8080/version)
          EXPECTED_VERSION=${{ github.sha }}
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
          echo "Version mismatch: expected $EXPECTED_VERSION, got $ACTUAL_VERSION"
          exit 1
          fi
          echo "Version verified: $ACTUAL_VERSION"
      - name: Show Container Logs
        run: docker logs orderservice
